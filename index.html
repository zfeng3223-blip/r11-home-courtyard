const fusionDialog=document.createElement('dialog');fusionDialog.className='fusion-dialog';fusionDialog.innerHTML='<div class="design-head"><h2>室内与小院 · 本次融合</h2><button id="closeFusion">关闭 ×</button></div><p>室内以R11书房无衣柜版为准，小院沿用「易打理第二客厅」文件。两份模型按同一CAD墙角等比例连接。</p><ul><li>主院：2621.4×5166.7mm；延伸：7062×1287mm，末端581mm窄条仍不纳入。</li><li>依你选择，通院门采用900mm平开门，向院子开启。门中心比旧R11位置移动约400mm。</li><li>新洞口涉及模型原墙角240×240mm的调整；不能据此判断实际墙体可拆。门洞、开启方向、门槛和高差需现场复核。</li><li>清除了R11原有简化院子占位、重复墙和旧推拉门，本轮另将两卧S隔墙与衣柜向次卧移100mm，并换入225cm主卧床。</li><li>保留小院座椅、桌椅收拢/展开、矮柜水槽、种植槽、炉位、铁架、玻璃/布篷/无顶棚、夜间和排水示意。</li><li>铁架高度、顶棚与荷载、围墙、供排水、炉位均沿用方案表达，未经现场与专业深化。</li></ul><p>本HTML已内嵌3D运行库和几何，无需资料文件夹或CDN。可保存PNG，导出当前餐桌与院子状态的GLB（完整墙高、门与设备关闭），下载融合JSON。</p><p>模型用于沟通，非现场复尺或施工图。</p>';

const bedroomDialog=document.createElement('dialog');bedroomDialog.className='fusion-dialog';bedroomDialog.innerHTML='<div class="design-head"><h2>主卧加宽10cm · 次卧让出10cm</h2><button id="closeBedroomInfo">关闭 ×</button></div><ul><li>S形轻隔墙、主卧2003宽衣柜与次卧1800宽衣柜，整体向次卧方向平移100mm，两侧柜深仍为600mm。</li><li>主卧采用2250mm整床总长、1150mm床头高、260mm床屏最大厚度。总长已含床屏；床身宽暂按1850mm，需要核实实物最大外宽。</li><li>以225cm床为基准，床尾通道从约510增至610mm；次卧柜前从约772减至672mm。次卧床和床脚约805mm保持。</li><li>主卧床保持原横向中心，未额外向主卫移动；窗侧床脚与墙凸角仍约258mm，这个窄点尚未解决。</li><li>移除原独立床头软包，床头本体统一表达；壁灯参考底高调至1250mm。床面高和产品截面是模型占位，非实物深化。</li><li>隔墙端部与原墙、通顶衣柜的隔声封边，以及次卧门套与柜侧收口，需要现场深化。不能把移动模型隔墙当作墙体可拆结论。</li></ul><p>模型尺寸，非现场复尺与施工图。上一版保留。</p>';
